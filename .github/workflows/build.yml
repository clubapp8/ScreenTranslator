name: App build

on: [push]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      OS: ${{ matrix.config.name }}
      MSVC_VERSION: C:/Program Files/Microsoft Visual Studio/2022/Enterprise
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "win64", os: windows-latest }
          - { name: "win32", os: windows-latest }
          - { name: "linux", os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-10 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-*
          echo "QMAKE_FLAGS=QMAKE_CXX=g++-10 QMAKE_CC=gcc-10 QMAKE_LINK=g++-10" >> $GITHUB_ENV
          # linuxdeployqt refuses newer glibc without this flag (see appimage.py)
          echo "DEBUG=1" >> $GITHUB_ENV

      - name: Install OpenSSL 1.1.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ matrix.config.name }}' -eq 'win32') { $extra += '--x86' }
          choco install openssl --version=1.1.1.2100 --allow-downgrade --force --no-progress -y @extra

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Make a release
        shell: bash
        run: |
          python ./share/ci/release.py
          echo "artifact=`python ./share/ci/release.py artifact_name`" >> $GITHUB_ENV

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ./${{ env.artifact }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') && env.artifact != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.artifact }}
